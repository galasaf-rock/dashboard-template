<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>לוח בקרה</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    body { font-family: 'Rubik', sans-serif; }
    .kpi-names { display: none; }
    .kpi-names.open { display: block; }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Rubik', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 text-gray-900 p-6 min-h-screen">

<div class="max-w-5xl mx-auto space-y-6">

  <div class="flex items-baseline justify-between">
    <h1 class="text-2xl font-bold">לוח בקרה</h1>
    <div class="flex items-center gap-4">
      <p class="text-xs text-gray-400">עודכן: <span id="last-updated">טוען...</span></p>
      <button onclick="clearData()" class="text-xs text-red-400 hover:text-red-600 underline">נקה נתונים</button>
    </div>
  </div>

  <!-- KPI Alert Cards -->
  <div id="kpi-section" class="grid grid-cols-2 gap-4 md:grid-cols-4"></div>

  <!-- Charts -->
  <div class="space-y-4">
    <div class="bg-white rounded-xl border border-gray-200 p-4 shadow-sm">
      <h2 class="text-sm font-medium text-gray-700 mb-3">לקוחות פעילים לפי חודש</h2>
      <canvas id="chart-active" height="90"></canvas>
    </div>
    <div class="bg-white rounded-xl border border-gray-200 p-4 shadow-sm">
      <h2 class="text-sm font-medium text-gray-700 mb-3">לקוחות חדשים לפי חודש</h2>
      <canvas id="chart-new" height="90"></canvas>
    </div>
    <div class="bg-white rounded-xl border border-gray-200 p-4 shadow-sm">
      <h2 class="text-sm font-medium text-gray-700 mb-3">הכנסות לפי חודש</h2>
      <canvas id="chart-revenue" height="90"></canvas>
    </div>
  </div>

</div>

<script>
const colorMap = {
  red:    { bg: "bg-red-50",    border: "border-red-200",    title: "text-red-700",    count: "text-red-800"    },
  orange: { bg: "bg-orange-50", border: "border-orange-200", title: "text-orange-700", count: "text-orange-800" },
  yellow: { bg: "bg-yellow-50", border: "border-yellow-200", title: "text-yellow-700", count: "text-yellow-800" },
  blue:   { bg: "bg-blue-50",   border: "border-blue-200",   title: "text-blue-700",   count: "text-blue-800"   },
}

const gridColor = 'rgba(0,0,0,0.06)'
const tooltipStyle = {
  backgroundColor: '#ffffff',
  titleColor: '#111827',
  bodyColor: '#374151',
  borderColor: '#e5e7eb',
  borderWidth: 1,
  padding: 10,
  rtl: true,
  textDirection: 'rtl',
}

function renderKPIs(openDebts, atRiskClients, expiringCards, noNextMeeting) {
  const kpiDefs = [
    {
      title: "חובות פתוחים",
      data: openDebts,
      mainValue: () => `${openDebts.count} לקוחות`,
      subValue: () => `₪${(openDebts.total || 0).toLocaleString('he-IL')}`,
      color: "red",
    },
    {
      title: "לקוחות בסיכון",
      data: atRiskClients,
      mainValue: () => `${atRiskClients.count} לקוחות`,
      subValue: null,
      color: "orange",
    },
    {
      title: "כרטיסיות לקראת סיום",
      data: expiringCards,
      mainValue: () => `${expiringCards.count} כרטיסיות`,
      subValue: null,
      color: "yellow",
    },
    {
      title: "פער בקביעת תור הבא",
      data: noNextMeeting,
      mainValue: () => `${noNextMeeting.count} לקוחות`,
      subValue: null,
      color: "blue",
    },
  ]

  const kpiSection = document.getElementById('kpi-section')
  kpiSection.innerHTML = ''

  kpiDefs.forEach((kpi, i) => {
    const c = colorMap[kpi.color]
    const names = kpi.data.names || []
    const hasNames = names.length > 0

    const card = document.createElement('div')
    card.className = `${c.bg} ${c.border} border rounded-xl p-4 shadow-sm cursor-pointer select-none`
    card.innerHTML = `
      <div class="text-xs font-medium ${c.title} mb-1">${kpi.title}</div>
      <div class="text-2xl font-bold ${c.count}">${kpi.mainValue()}</div>
      ${kpi.subValue ? `<div class="text-sm ${c.title} mt-0.5">${kpi.subValue()}</div>` : ''}
      ${hasNames ? `
        <div class="kpi-names mt-2 text-xs ${c.title} space-y-0.5" id="names-${i}">
          ${names.map(n => `<div>• ${n}</div>`).join('')}
        </div>
        <div class="text-xs ${c.title} mt-2 opacity-60" id="toggle-${i}">▼ הצג שמות</div>
      ` : ''}
    `
    if (hasNames) {
      card.addEventListener('click', () => {
        const namesEl  = document.getElementById(`names-${i}`)
        const toggleEl = document.getElementById(`toggle-${i}`)
        namesEl.classList.toggle('open')
        toggleEl.textContent = namesEl.classList.contains('open') ? '▲ הסתר' : '▼ הצג שמות'
      })
    }
    kpiSection.appendChild(card)
  })
}

function makeBarChart(id, labels, datasets) {
  const ctx = document.getElementById(id).getContext('2d')
  new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets },
    options: {
      responsive: true,
      plugins: {
        legend: { display: datasets.length > 1, position: 'bottom', labels: { font: { size: 12 } } },
        tooltip: { ...tooltipStyle },
      },
      scales: {
        x: {
          reverse: true,
          grid: { display: false },
          border: { display: false },
          ticks: { font: { size: 12 } },
        },
        y: {
          grid: { color: gridColor },
          border: { display: false },
          ticks: { font: { size: 12 }, callback: v => Number.isInteger(v) ? v : null },
        },
      },
    },
  })
}

function makeCurrencyChart(id, labels, datasets) {
  const ctx = document.getElementById(id).getContext('2d')
  new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets },
    options: {
      responsive: true,
      plugins: {
        legend: { display: true, position: 'bottom', labels: { font: { size: 12 } } },
        tooltip: {
          ...tooltipStyle,
          callbacks: { label: ctx => `${ctx.dataset.label}: ₪${Math.round(ctx.raw).toLocaleString('he-IL')}` },
        },
      },
      scales: {
        x: {
          reverse: true,
          grid: { display: false },
          border: { display: false },
          ticks: { font: { size: 12 } },
        },
        y: {
          grid: { color: gridColor },
          border: { display: false },
          ticks: { font: { size: 12 }, callback: v => v > 0 ? `₪${(v/1000).toFixed(0)}k` : '0' },
        },
      },
    },
  })
}

function renderCharts(MONTHS, activeClients, newClients, revenueTotal, revenuePaid) {
  Chart.defaults.font.family = 'Rubik'
  Chart.defaults.color = '#6b7280'

  makeBarChart('chart-active', MONTHS, [{
    label: 'לקוחות פעילים',
    data: activeClients,
    backgroundColor: 'hsl(221, 83%, 53%)',
    borderRadius: 4,
    maxBarThickness: 52,
  }])

  makeBarChart('chart-new', MONTHS, [{
    label: 'לקוחות חדשים',
    data: newClients,
    backgroundColor: 'hsl(221, 83%, 53%)',
    borderRadius: 4,
    maxBarThickness: 52,
  }])

  makeCurrencyChart('chart-revenue', MONTHS, [
    {
      label: 'מכירות',
      data: revenueTotal,
      backgroundColor: 'hsl(221, 83%, 53%)',
      borderRadius: 4,
      maxBarThickness: 52,
    },
    {
      label: 'שולם',
      data: revenuePaid,
      backgroundColor: 'hsl(142, 71%, 45%)',
      borderRadius: 4,
      maxBarThickness: 52,
    },
  ])
}

async function loadDashboard() {
  try {
    const res = await fetch('/api/get-data')
    if (!res.ok) throw new Error(`HTTP ${res.status}`)
    const d = await res.json()

    document.getElementById('last-updated').textContent = d.lastUpdated
    renderKPIs(d.openDebts, d.atRiskClients, d.expiringCards, d.noNextMeeting)
    renderCharts(d.months, d.activeClients, d.newClients, d.revenueTotal, d.revenuePaid)
  } catch (err) {
    document.getElementById('last-updated').textContent = 'שגיאה בטעינת נתונים'
    console.error('Dashboard load error:', err)
  }
}

async function clearData() {
  if (!confirm('למחוק את כל הנתונים?')) return
  const password = prompt('סיסמה:')
  if (!password) return

  const res = await fetch('/api/clear', {
    method: 'POST',
    headers: { 'x-upload-password': password },
  })

  if (res.ok) {
    location.reload()
  } else {
    alert('שגיאה — בדוק סיסמה')
  }
}

loadDashboard()
</script>
</body>
</html>
